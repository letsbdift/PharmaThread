{% extends 'base.html' %}
{% block content %}
<div class="mb-4">
    <h2 class="text-2xl font-bold text-slate-800">Add New Medicine</h2>
</div>

<div class="bg-white rounded border border-slate-200 p-6 shadow-sm max-w-2xl">
    <form method="POST">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-6">
            <div class="col-span-2">
                <label class="block text-sm font-semibold text-slate-600 mb-1">Medicine / Drug Name <span class="text-rose-500">*</span></label>
                <input type="text" name="name" required class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Manufacturer <span class="text-rose-500">*</span></label>
                <input type="text" name="manufacturer" required class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Generic Name / Composition</label>
                <input type="text" name="generic_name" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Category</label>
                <select name="category" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-sky-500">
                    <option value="TABLET">Tablet</option>
                    <option value="SYRUP">Syrup</option>
                    <option value="INJECTION">Injection</option>
                    <option value="OINTMENT">Ointment</option>
                    <option value="DROPS">Drops</option>
                    <option value="OTHER">Other</option>
                </select>
            </div>
            
            <div class="col-span-2 border-t border-slate-200 mt-2 pt-4">
                <h3 class="text-sm font-bold text-sky-700 mb-3"><i class="ph ph-package mr-1"></i> Packaging & Stock Rules</h3>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Tablets per Strip <span class="text-rose-500">*</span></label>
                <input type="number" name="units_per_pack" required min="1" value="10" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-sky-500">
                <p class="text-xs text-slate-400 mt-1">E.g. 10 tablets in a strip, or 1 for Syrup bottle.</p>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Minimum Stock Level</label>
                <input type="number" name="min_stock_level" value="10" min="0" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Location / Rack</label>
                <input type="text" name="rack_location" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-sky-500">
            </div>
            <div class="flex items-center mt-6">
                <input type="checkbox" name="is_schedule_h" id="is_schedule_h" class="w-4 h-4 text-sky-600 border-slate-300 rounded focus:ring-sky-500">
                <label for="is_schedule_h" class="ml-2 block text-sm font-semibold text-slate-600">
                    Schedule H Drug (Prescription Required)
                </label>
            </div>
        </div>
        
        <div class="mt-8 flex justify-end">
            <button type="submit" class="bg-emerald-600 text-white px-6 py-2 rounded font-bold hover:bg-emerald-700 transition-colors">
                <i class="ph ph-check mr-1"></i> Save Drug Master
            </button>
        </div>
    </form>
</div>
{% endblock %}
