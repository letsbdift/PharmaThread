{% extends 'base.html' %}
{% block content %}
<div class="mb-4 flex justify-between items-center">
    <h2 class="text-2xl font-bold text-slate-800">Edit Drug: {{ med.name }}</h2>
    <a href="{% url 'medicine_list' %}" class="text-sky-600 hover:underline">Cancel</a>
</div>

<div class="bg-white rounded border border-slate-200 p-6 shadow-sm max-w-2xl">
    <form method="POST">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="col-span-2">
                <label class="block text-sm font-semibold text-slate-600 mb-1">Medicine / Drug Name <span class="text-rose-500">*</span></label>
                <input type="text" name="name" value="{{ med.name }}" required class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Manufacturer <span class="text-rose-500">*</span></label>
                <input type="text" name="manufacturer" value="{{ med.manufacturer }}" required class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Generic Name / Composition</label>
                <input type="text" name="generic_name" value="{{ med.generic_name }}" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Category</label>
                <select name="category" id="categorySelect" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-sky-500">
                    <option value="TABLET" {% if med.category == 'TABLET' %}selected{% endif %}>Tablet</option>
                    <option value="SYRUP" {% if med.category == 'SYRUP' %}selected{% endif %}>Syrup</option>
                    <option value="INJECTION" {% if med.category == 'INJECTION' %}selected{% endif %}>Injection</option>
                    <option value="OINTMENT" {% if med.category == 'OINTMENT' %}selected{% endif %}>Ointment</option>
                    <option value="DROPS" {% if med.category == 'DROPS' %}selected{% endif %}>Drops</option>
                    <option value="OTHER" {% if med.category == 'OTHER' %}selected{% endif %}>Other</option>
                </select>
            </div>
            
            <div class="col-span-2 border-t border-slate-200 mt-2 pt-4">
                <h3 class="text-sm font-bold text-sky-700 mb-3"><i class="ph ph-package mr-1"></i> Packaging & Stock Rules</h3>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1" id="unitsLabel">Tablets per Strip <span class="text-rose-500">*</span></label>
                <input type="number" name="units_per_pack" required min="1" value="{{ med.units_per_pack }}" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-sky-500">
                <p class="text-xs text-slate-400 mt-1" id="unitsHint">E.g. 10 tablets in a strip, or 1 for Syrup bottle.</p>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Minimum Stock Level (Strips)</label>
                <input type="number" name="min_stock_level" min="0" value="{{ med.min_stock_level }}" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Location / Rack</label>
                <input type="text" name="rack_location" value="{{ med.rack_location }}" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-sky-500">
            </div>
            <div class="flex items-center mt-6">
                <input type="checkbox" name="is_schedule_h" id="is_schedule_h" class="w-4 h-4 text-sky-600 border-slate-300 rounded focus:ring-sky-500" {% if med.is_schedule_h %}checked{% endif %}>
                <label for="is_schedule_h" class="ml-2 block text-sm font-semibold text-slate-600">
                    Schedule H Drug (Prescription Required)
                </label>
            </div>
        </div>
        
        <div class="mt-8 flex justify-end">
            <button type="submit" class="bg-sky-600 text-white px-6 py-2 rounded font-bold hover:bg-sky-700 transition-colors">
                <i class="ph ph-check mr-1"></i> Update Drug Master
            </button>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const categorySelect = document.getElementById('categorySelect');
    const unitsLabel = document.getElementById('unitsLabel');
    const unitsHint = document.getElementById('unitsHint');
    
    if(!categorySelect || !unitsLabel) return;
    
    function updateLabels() {
        const cat = categorySelect.value;
        if (cat === 'TABLET') {
            unitsLabel.innerHTML = 'Tablets per Strip <span class="text-rose-500">*</span>';
            unitsHint.innerText = 'E.g. 10 for a 10-tablet strip.';
        } else if (cat === 'SYRUP') {
            unitsLabel.innerHTML = 'Volume per Bottle (ml) <span class="text-rose-500">*</span>';
            unitsHint.innerText = 'E.g. 100 for a 100ml bottle.';
        } else if (cat === 'INJECTION') {
            unitsLabel.innerHTML = 'Volume per Vial/Ampoule (ml) <span class="text-rose-500">*</span>';
            unitsHint.innerText = 'E.g. 5 for a 5ml vial.';
        } else if (cat === 'OINTMENT') {
            unitsLabel.innerHTML = 'Weight per Tube (g) <span class="text-rose-500">*</span>';
            unitsHint.innerText = 'E.g. 30 for a 30g tube.';
        } else if (cat === 'DROPS') {
            unitsLabel.innerHTML = 'Volume per Dropper (ml) <span class="text-rose-500">*</span>';
            unitsHint.innerText = 'E.g. 10 for a 10ml dropper.';
        } else {
            unitsLabel.innerHTML = 'Units per Pack <span class="text-rose-500">*</span>';
            unitsHint.innerText = 'Base units in one pack/box.';
        }
    }
    
    categorySelect.addEventListener('change', updateLabels);
    updateLabels(); 
});
</script>


{% endblock %}
