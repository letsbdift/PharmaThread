{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto mt-12 bg-white rounded border border-slate-200 p-8 shadow-sm text-center">
    <div class="h-16 w-16 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="ph ph-trash text-3xl text-rose-600"></i>
    </div>
    <h2 class="text-2xl font-bold text-slate-800 mb-2">Delete Medicine?</h2>
    <p class="text-slate-600 mb-8">Are you sure you want to delete <strong>{{ med.name }}</strong>? This action cannot be undone and may affect historical billing records if this item was sold.</p>
    
    <form method="POST" class="flex justify-center space-x-4">
        {% csrf_token %}
        <a href="{% url 'medicine_list' %}" class="bg-slate-200 text-slate-700 px-6 py-2 rounded font-bold hover:bg-slate-300 transition-colors">
            Cancel
        </a>
        <button type="submit" class="bg-rose-600 text-white px-6 py-2 rounded font-bold hover:bg-rose-700 transition-colors">
            Yes, Delete It
        </button>
    </form>
</div>
{% endblock %}
