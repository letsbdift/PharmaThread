<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PharmaSync POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
        <div class="bg-slate-900 p-6 text-center">
            <h1 class="text-2xl font-bold text-emerald-400 flex items-center justify-center">
                <i class="ph ph-pill text-3xl mr-2"></i> PharmaSync
            </h1>
            <p class="text-slate-400 text-sm mt-2">Secure Access Gateway</p>
        </div>
        
        <div class="p-8">
            {% if form.errors %}
                <div class="mb-4 bg-rose-50 border-l-4 border-rose-500 text-rose-700 p-3 text-sm rounded-r">
                    <p class="font-bold">Authentication Failed</p>
                    <p>Invalid username or password. Please try again.</p>
                </div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Username</label>
                    <div class="relative">
                        <i class="ph ph-user absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-lg"></i>
                        <input type="text" name="username" class="w-full pl-10 pr-3 py-2 border border-slate-300 rounded focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors" placeholder="Enter your username" required autofocus>
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                    <div class="relative">
                        <i class="ph ph-lock-key absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-lg"></i>
                        <input type="password" name="password" class="w-full pl-10 pr-3 py-2 border border-slate-300 rounded focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors" placeholder="Enter your password" required>
                    </div>
                </div>

                <input type="hidden" name="next" value="{{ next|default:'' }}">
                
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded shadow transition-colors flex items-center justify-center">
                    Secure Login <i class="ph ph-sign-in ml-2"></i>
                </button>
            </form>
            
            <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-400">
                <p>&copy; {% now "Y" %} Meezan POS Systems. Authorized Personnel Only.</p>
            </div>
        </div>
    </div>

</body>
</html>
